name: Playwright End-to-End Tests

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-e2e:
    name: Run Playwright E2E Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Sync Database Schema & Generate Prisma Client
        run: |
          npx prisma generate
          npx prisma db push

      - name: Seed SQLite Database
        run: npm run db:seed

      - name: Build Next.js Production App
        run: npm run build

      - name: Run Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
